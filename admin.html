<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - قهوة القنطرة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #333;
      background: #2b2b2b;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      background-color: #d4af37;
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #f1c40f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>لوحة تحكم الكراسين</h2>
    <form id="addChairForm">
      <input type="text" id="chairName" placeholder="اسم الكرسين" required>
      <!-- حقل الرابط بدلاً من رفع الملف -->
      <input type="url" id="chairImage" placeholder="رابط الصورة المباشر (https://...)" required>
      <button type="submit">إضافة الكرسين</button>
    </form>
  </div>

  <script>
    // رابط الباك إند على Render
    const API_BASE_URL = 'https://caffe-alqantara.onrender.com'; 

    document.getElementById('addChairForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('chairName').value;
      const image = document.getElementById('chairImage').value;

      try {
        const res = await fetch(`${API_BASE_URL}/api/chairs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, image })
        });

        const data = await res.json();

        if (res.ok) {
          alert('تمت إضافة الكرسين بنجاح!');
          document.getElementById('addChairForm').reset();
        } else {
          alert(data.message || 'حدث خطأ أثناء الإضافة');
        }
      } catch (err) {
        alert('تعذر الاتصال بالسيرفر!');
        console.error(err);
      }
    });
  </script>
</body>
</html>
